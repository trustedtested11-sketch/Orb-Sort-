<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orb Sort</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120d2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600&display=swap">
<style>
html,body{margin:0}
/* Layout: one-screen arcade. Header strip, level title with progress dots, glass tubes in two balanced rows, a dock of round controls. Deliberately single-look (dark neon night) so the orbs glow. */
:root{
  --bg:#120d2e;
  --ink:#f6f3ff;
  --muted:#a89fd8;
  --glass:rgba(255,255,255,.08);
  --glass-line:rgba(255,255,255,.2);
  --accent:#ffcf4a;
  --accent-ink:#2b1a00;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ball:clamp(30px,10.5vw,46px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:radial-gradient(110% 70% at 50% -8%,#3b2a94 0%,rgba(59,42,148,0) 62%),var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.42}
.orbs i:nth-child(1){width:300px;height:300px;left:-110px;top:24%;background:#ff4f9a;animation:drift 15s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:260px;height:260px;right:-90px;top:46%;background:#2fa8ff;animation:drift 18s ease-in-out infinite alternate-reverse}
.orbs i:nth-child(3){width:220px;height:220px;left:30%;bottom:-90px;background:#9a5cff;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(26px,-34px)}}
.orbs span{position:absolute;bottom:-20px;border-radius:50%;background:#fff;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.5}85%{opacity:.25}100%{transform:translateY(-110vh);opacity:0}}

.app{position:relative;z-index:1;min-height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-block:12px 16px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:.3px;background:linear-gradient(180deg,#ffffff,#cdbfff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.brand svg{width:30px;height:30px;flex:none}
.moves{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line)}
.moves span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.moves b{min-width:38px;text-align:center;font-family:var(--font-display);font-size:22px;line-height:1;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
.moves b.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.25)}}

.lvl{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.lvl h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;text-wrap:balance;text-align:center}
.lvl h1 small{display:block;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-family:var(--font-body)}
.dots{display:flex;gap:8px}
.dots i{width:26px;height:8px;border-radius:99px;background:rgba(255,255,255,.16);transition:background .3s,transform .3s}
.dots i.cur{background:var(--accent);transform:scaleX(1.25)}
.dots i.ok{background:#3fe0a0}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:34px 10px}
.board{display:flex;flex-direction:column;align-items:center;gap:calc(var(--ball)*.7);transition:opacity .35s,transform .35s}
.board.out{opacity:0;transform:translateY(18px) scale(.96)}
.board.in{animation:boardIn .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes boardIn{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.row{position:relative;display:flex;justify-content:center;gap:calc(var(--ball)*.2)}
.row::after{content:"";position:absolute;left:-12px;right:-12px;bottom:-9px;height:12px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 26px rgba(0,0,0,.4);pointer-events:none}

.tube{
  --glow:#fff;
  position:relative;flex:none;
  width:calc(var(--ball) + 18px);
  height:calc(var(--ball)*4 + 40px);
  padding:12px 7px;
  display:flex;flex-direction:column-reverse;gap:4px;
  border:2px solid var(--glass-line);border-top-color:rgba(255,255,255,.1);
  border-radius:12px 12px calc((var(--ball) + 18px)/2) calc((var(--ball) + 18px)/2);
  background:linear-gradient(100deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 34%,rgba(255,255,255,.02) 66%,rgba(255,255,255,.13));
  box-shadow:inset 0 -12px 18px rgba(0,0,0,.2),0 16px 22px -12px rgba(0,0,0,.6);
  cursor:pointer;
  transition:box-shadow .25s,border-color .25s,transform .25s;
}
.tube::before{content:"";position:absolute;left:7px;top:16px;bottom:30px;width:5px;border-radius:9px;background:rgba(255,255,255,.2);pointer-events:none}
.tube::after{content:"";position:absolute;left:-2px;right:-2px;top:-8px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.34);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03));pointer-events:none;z-index:1}
.tube.flash{animation:tubeHit .4s ease-out}
@keyframes tubeHit{30%{transform:translateY(3px) scale(1.03,.985);filter:brightness(1.4)}}
.tube.sel{border-color:var(--accent);box-shadow:inset 0 -12px 18px rgba(0,0,0,.2),0 0 0 3px rgba(255,207,74,.25),0 0 26px rgba(255,207,74,.35)}
.tube.done{border-color:var(--glow);box-shadow:inset 0 -12px 18px rgba(0,0,0,.2),0 0 22px color-mix(in srgb,var(--glow) 60%,transparent),0 16px 22px -12px rgba(0,0,0,.6);cursor:default}
.tube.pulse{animation:tubePulse .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes tubePulse{35%{transform:scale(1.1,.96)}70%{transform:scale(.97,1.04)}}
.tube.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.tube.hint-from{animation:hintFrom .9s ease-in-out infinite}
.tube.hint-to{animation:hintTo .9s ease-in-out infinite}
@keyframes hintFrom{50%{box-shadow:inset 0 -12px 18px rgba(0,0,0,.2),0 0 0 4px rgba(255,207,74,.35),0 0 30px rgba(255,207,74,.55);transform:translateY(-4px)}}
@keyframes hintTo{50%{box-shadow:inset 0 -12px 18px rgba(0,0,0,.2),0 0 0 4px rgba(255,255,255,.3),0 0 30px rgba(255,255,255,.45)}}

.ball{
  position:relative;flex:none;
  width:var(--ball);height:var(--ball);border-radius:50%;
  background:radial-gradient(circle at 34% 26%,var(--c1) 0%,var(--c2) 46%,var(--c3) 100%);
  box-shadow:inset 0 -5px 7px rgba(0,0,0,.25),inset 0 3px 5px rgba(255,255,255,.3),0 3px 5px rgba(0,0,0,.35),0 6px 14px color-mix(in srgb,var(--c2) 28%,transparent);
  transition:transform .24s cubic-bezier(.3,1.6,.5,1);
}
.ball::after{content:"";position:absolute;left:19%;top:13%;width:32%;height:22%;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(1px);transform:rotate(-32deg)}
.ball.lift{z-index:3;transform:translateY(var(--lift,-60px)) scale(1.06)}
.ball.ghost{visibility:hidden}
.ball.land{animation:squash .34s ease-out;transform-origin:50% 100%}
@keyframes squash{0%{transform:scale(1.14,.8)}55%{transform:scale(.94,1.08)}100%{transform:none}}
.tube.cele .ball{animation:hop .5s cubic-bezier(.3,1.5,.5,1) both}
.tube.cele .ball:nth-child(2){animation-delay:.06s}
.tube.cele .ball:nth-child(3){animation-delay:.12s}
.tube.cele .ball:nth-child(4){animation-delay:.18s}
@keyframes hop{40%{transform:translateY(-14px)}}

.tip{margin:0;min-height:20px;max-width:280px;text-align:center;font-size:14px;font-weight:500;color:var(--muted);text-wrap:balance}

.dock{display:flex;justify-content:center;gap:14px;padding-top:6px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.dbtn .ic{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid var(--glass-line);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s,opacity .2s}
.dbtn .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dbtn .cap{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dbtn:active .ic{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.dbtn.gold .ic{background:linear-gradient(180deg,#ffe27a,#ffb627);color:var(--accent-ink);border-color:#ffe99a;box-shadow:0 5px 0 #b9770a}
.dbtn.gold:active .ic{box-shadow:0 1px 0 #b9770a}
.dbtn[disabled]{cursor:default}
.dbtn[disabled] .ic,.dbtn[disabled] .cap{opacity:.35}

.lvl h1.in{animation:titleIn .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes titleIn{from{opacity:0;transform:translateY(-10px) scale(.85)}}
#fly{position:fixed;inset:0;z-index:30;pointer-events:none}
.touch{position:absolute;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 6px rgba(255,255,255,.22),0 8px 18px rgba(0,0,0,.4);opacity:0;transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .3s}
.touch::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.75);animation:ripple 1.1s ease-out infinite}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
#fly .ball{position:absolute;transition:none;margin:0}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:700;font-size:26px;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px currentColor;white-space:nowrap;animation:floatUp .95s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

#clear{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
.clear-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:clearIn .55s cubic-bezier(.2,1.5,.4,1) both}
.clear-card b{font-family:var(--font-display);font-size:clamp(40px,13vw,58px);line-height:1;background:linear-gradient(180deg,#fff6c4,#ffc93c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px rgba(255,207,74,.55))}
.clear-card span{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes clearIn{from{opacity:0;transform:scale(.5) rotate(-4deg)}}

#end{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(10,6,32,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .4s both}
@keyframes fade{from{opacity:0}}
.card{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px 18px;border-radius:30px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);box-shadow:0 30px 60px rgba(0,0,0,.45);animation:cardIn .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.9)}}
.trophy{display:flex;align-items:flex-end;gap:6px;height:80px}
.trophy .ball{--ball:42px;animation:bob 1.6s ease-in-out infinite}
.trophy .ball:nth-child(2){--ball:52px;animation-delay:.2s}
.trophy .ball:nth-child(3){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-8px)}}
.card h2{margin:0;font-family:var(--font-display);font-size:34px;line-height:1.05;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px;max-width:260px;text-wrap:balance}
.stars{display:flex;gap:6px}
.stars svg{width:46px;height:46px;fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.25);stroke-width:1.2;stroke-linejoin:round}
.stars svg.on{fill:#ffcf4a;stroke:#fff0a8;filter:drop-shadow(0 0 10px rgba(255,207,74,.7));animation:starIn .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:var(--d,0s)}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}}
.facts{display:flex;gap:10px;width:100%}
.facts div{flex:1;padding:10px 8px;border-radius:16px;background:rgba(0,0,0,.22)}
.facts span{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts b{font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.btn{font-family:var(--font-display);font-weight:700;border:0;border-radius:18px;cursor:pointer}
.btn.primary{position:relative;overflow:hidden;display:block;width:100%;padding:16px 20px;font-size:22px;text-align:center;text-decoration:none;color:var(--accent-ink);background:linear-gradient(180deg,#ffe27a,#ffb627);box-shadow:0 6px 0 #b9770a,0 14px 26px rgba(255,182,39,.35);animation:cta 1.5s ease-in-out infinite}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
@keyframes cta{50%{transform:scale(1.04)}}
@keyframes shine{55%,100%{left:130%}}
.btn.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #b9770a}
.btn.ghost{background:none;color:var(--muted);font-size:16px;padding:8px 14px;font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs>
        <radialGradient id="g1" cx=".35" cy=".28" r=".9"><stop offset="0" stop-color="#ffb0b8"/><stop offset=".5" stop-color="#ff4d5e"/><stop offset="1" stop-color="#a81a3a"/></radialGradient>
        <radialGradient id="g2" cx=".35" cy=".28" r=".9"><stop offset="0" stop-color="#b6e5ff"/><stop offset=".5" stop-color="#2fa8ff"/><stop offset="1" stop-color="#1355b8"/></radialGradient>
        <radialGradient id="g3" cx=".35" cy=".28" r=".9"><stop offset="0" stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#c98a00"/></radialGradient></defs>
        <circle cx="10" cy="21" r="8" fill="url(#g1)"/><circle cx="22" cy="21" r="8" fill="url(#g2)"/><circle cx="16" cy="10" r="8" fill="url(#g3)"/></svg>
      Orb Sort
    </div>
    <div class="moves"><span>Moves</span><b id="moves">0</b></div>
  </header>

  <section class="lvl">
    <h1 id="lvlTitle">Level 1</h1>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>

  <main class="stage">
    <div class="board" id="board"></div>
    <p class="tip" id="tip" aria-live="polite"></p>
  </main>

  <nav class="dock" aria-label="Game controls">
    <button class="dbtn" id="bUndo" type="button" disabled><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span><span class="cap">Undo</span></button>
    <button class="dbtn gold" id="bHint" type="button"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span><span class="cap">Hint</span></button>
    <button class="dbtn" id="bReset" type="button"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.9 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/></svg></span><span class="cap">Restart</span></button>
    <button class="dbtn" id="bSound" type="button" aria-pressed="false"><span class="ic" id="sndIc"></span><span class="cap">Sound</span></button>
  </nav>
</div>

<div id="fly" aria-hidden="true"></div>

<div id="clear" hidden><div class="clear-card"><b id="clearTxt">Level clear</b><span id="clearSub"></span></div></div>

<section id="end" hidden aria-labelledby="endTitle">
  <div class="card">
    <div class="trophy" id="trophy" aria-hidden="true"></div>
    <h2 id="endTitle">All tubes sorted</h2>
    <div class="stars" id="stars" aria-label="Star rating"></div>
    <div class="facts">
      <div><span>Moves</span><b id="endMoves">0</b></div>
      <div><span>Par</span><b id="endPar">0</b></div>
    </div>
    <p>Ready for harder tubes and more colors?</p>
    <a class="btn primary" id="cta" href="https://example.com/install" target="_blank" rel="noopener">Play Full Game</a>
    <button class="btn ghost" id="again" type="button">Play again</button>
  </div>
</section>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
const CAP = 4;
function topRun(t) {
  if (!t.length) return 0;
  const c = t[t.length - 1];
  let n = 0;
  for (let i = t.length - 1; i >= 0 && t[i] === c; i--) n++;
  return n;
}
function isUniform(t) {
  return t.length > 0 && t.every(x => x === t[0]);
}
function moveCount(ts, a, b) {
  if (a === b) return 0;
  const A = ts[a], B = ts[b];
  if (!A.length || B.length >= CAP) return 0;
  if (B.length && B[B.length - 1] !== A[A.length - 1]) return 0;
  return Math.min(topRun(A), CAP - B.length);
}
function doMove(ts, a, b) {
  const n = moveCount(ts, a, b);
  if (!n) return null;
  const nt = ts.map(t => t.slice());
  for (let i = 0; i < n; i++) nt[b].push(nt[a].pop());
  return { ts: nt, n };
}
function tubeComplete(t) {
  return t.length === CAP && t.every(x => x === t[0]);
}
function isSolved(ts) {
  return ts.every(t => t.length === 0 || tubeComplete(t));
}
function keyOf(ts) {
  return ts.map(t => t.join('')).sort().join('|');
}
function solve(start, cap) {
  cap = cap || 150000;
  if (isSolved(start)) return [];
  const seen = new Set([keyOf(start)]);
  const nodes = [{ ts: start, parent: -1, mv: null }];
  for (let h = 0; h < nodes.length && nodes.length < cap; h++) {
    const cur = nodes[h].ts;
    for (let a = 0; a < cur.length; a++) {
      const A = cur[a];
      if (!A.length || tubeComplete(A)) continue;
      for (let b = 0; b < cur.length; b++) {
        if (a === b) continue;
        if (!cur[b].length && isUniform(A)) continue;
        const r = doMove(cur, a, b);
        if (!r) continue;
        const k = keyOf(r.ts);
        if (seen.has(k)) continue;
        seen.add(k);
        nodes.push({ ts: r.ts, parent: h, mv: [a, b] });
        if (isSolved(r.ts)) {
          const path = [];
          let i = nodes.length - 1;
          while (nodes[i].parent >= 0) { path.push(nodes[i].mv); i = nodes[i].parent; }
          return path.reverse();
        }
      }
    }
  }
  return null;
}

$('bSound').addEventListener('click', () => {
  muted = !muted; $('sndIc').innerHTML = muted ? ICON_OFF : ICON_ON; $('bSound').setAttribute('aria-pressed', String(muted));
  ac(); if (!muted) sfx.tick();
});
$('bUndo').addEventListener('click', () => {
  ac(); idleReset();
  if (busy || overlay || !hist.length) return;
  clearHint(); sel = null; updateSel();
  const m = hist.pop(); moves = Math.max(0, moves - 1); updateHud();
  sfx.put(); applyMove(m.b, m.a, m.n, true);
});
$('bHint').addEventListener('click', () => { ac(); sfx.tick(); idleReset(); showHint(); });
$('bReset').addEventListener('click', () => {
  ac(); sfx.tick();
  if (busy || overlay) return;
  clearHint(); board.classList.add('out');
  setTimeout(() => loadLevel(lvl), 300);
});
$('again').addEventListener('click', () => {
  sfx.tick(); $('end').hidden = true; overlay = false; movesByLevel = []; loadLevel(0);
});
$('cta').addEventListener('click', ctaOpen);
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden && AC && AC.state === 'running') AC.suspend().catch(() => {}); });

resize();
loadLevel(0);
</script>

</body>
</html>
